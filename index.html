<!DOCTYPE html>

<html lang="en">

    crossorigin="anonymous"

<body class="bg-light text-dark">
  <header class="bg-dark border-bottom border-warning border-4">
    <nav class="navbar navbar-expand navbar-dark bg-dark site-navbar">
      <div class="container-fluid">
        <ul class="navbar-nav flex-row gap-3">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>

  <main>
    <div class="container-sm py-4 text-center">
      <h1 class="mb-4">Connect4</h1>
      <form class="login-form mx-auto" method="get" action="play.html">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="text" class="form-control" placeholder="your@email.com" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="password" />
        </div>
        <div class="d-flex justify-content-center gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
          <button type="submit" class="btn btn-warning">Create</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="container-fluid d-flex justify-content-between align-items-center bg-dark text-white-50 border-top border-warning">
